name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェックとテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npx vite build

      - name: 配信用の成果物を保存
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Pages へ配信
    # 型チェックとテストが通ったときだけ配信する（設計 §12）。
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # 配信ジョブにだけ書き込み権限を与える。
    permissions:
      contents: read
      pages: write
      id-token: write

    # 進行中の配信は中断せず、キューに積む。
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
