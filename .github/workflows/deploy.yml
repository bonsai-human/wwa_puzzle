name: Deploy to GitHub Pages

# 型チェックとテストが通ったときだけ配信する（設計 §12）。
# CI ワークフローの完走を待ってから走らせる。
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 進行中の配信は中断せず、キューに積む。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: ビルドして配信
    # CI が失敗したコミットは配信しない。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run はデフォルトブランチの HEAD を指すため、
          # CI が通った当該コミットを明示的に取り出す。
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
